<html>
  <head>
    <style>
      .outer
           { 
            width: 1000px;
            height: 700px;
            background: #F3E0E2;
            margin: 50px auto;
            padding: 50px 100px;
            box-sizing: border-box;
           }
      .box{
        width: 400px;
        height: 600px;
        
        padding:40px 40px;
          box-sizing: border-box;
        float: left;
      }
      #left{
          border-radius: 10px 0px 0px 10px;
          box-shadow: 0px 0px 5px gray;
          text-align: center;
          background: white;

          
      }
      #right{
          border-radius: 0px 10px 10px 0px;
          box-shadow: 0px 0px 10px gray;
          text-align: center;
          background: linear-gradient(#FE4168);
          color: white;
          padding: 200px 25px;
          box-sizing: border-box;
          
      }
      #icon{
        width: 320px;
        height: 100px;
        line-height: 100px;
        padding: 10px 10px;
        box-sizing: border-box;
      }
      img{
        width: 35px;
        height: 35px;
        margin-left: 20px;
      }
      .t{
        width: 320px;
        height: 40px;
        border: none;
        background: rgba(128, 128, 128,.1);
        padding: auto 10px;
        box-sizing: border-box;
        margin-bottom: 25px;
        padding-left: 10px;
      }
      .login{
        color:gray;
        margin-top: 25px;
      }
      #btn{
        background-color: #FE4168;
        border-radius: 50px 50px 50px 50px;
        width: 150px;
        height: 40px;
        color:white;
        font-size: 15px;
        font-weight: bold;
        line-height: 40px;
        margin-top: 20px;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="outer">
      <div class="box" id="left">
      <h1>Login</h1>
      <div id="icon">
        <a href="#"><img src="makeitfull.png" alt=""></a> <a href="#"><img src="google.png" alt=""> </a>
      </div>
      <div class="login">
       
        <form action="">
           or use your account <br><br>
          <input type="email" class="t" placeholder="Email"><br>
          <input type="password" class="t" placeholder="Password"><br>
         <a href="#" style="text-decoration: none; color:gray"> Forgot your password?</a><br>
          <button id="btn">LOGIN</button>
        </form>
      </div>
      </div>
      <div class="box" id="right">
        <h1>HTML CSS Login <br>Form</h1>
        <small>The login form is created using pure <br>HTML and CSS. For social icons <br>FontAwesome is used. </small>
      </div>
    </div>

  </body>

</html>
